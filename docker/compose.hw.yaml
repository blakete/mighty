# hw-mighty — ONE idling container; the MIGHTY planner, state converter, MPC and
# the RViz goal republisher are docker-exec'd into it from a HOST tmux session
# 'hw_mighty' built by mighty_hw.sh (the single entrypoint).
#
#   build:   make hw-build            (docker compose build --ssh ...; see Makefile)
#   pull:    ./mighty_hw.sh pull [tag] (fleet registry -> mighty-hw:local)
#   up:      ./mighty_hw.sh start [--dev]
#   attach:  tmux attach -t hw_mighty  (HOST session; Ctrl-C / Up / Enter restarts one node)
#   down:    ./mighty_hw.sh stop
#
# The container must NEVER launch the session itself: when its command also
# built the tmux session (pre-2026-07-30) every start produced TWO full stacks
# double-publishing on cmd_vel_auto.
#
# PREREQS on a rover: drive.service (zenoh router on :7447), sensors.service
# (livox + D455 + base_link->lidar TF), dlio.service (odometry + map->odom) and
# the Orin mapper. This file launches none of them; the nodes attach to the host
# router over network_mode: host.
name: hw-mighty
services:
  hw-mighty:
    build:
      context: ..                      # the mighty repo root; deps are cloned in-image
      dockerfile: docker/Dockerfile.hw
    image: mighty-hw:local
    container_name: hw-mighty
    network_mode: host                 # reach the host rmw_zenohd on :7447
    # Identity + transport from the rover's provisioned env (ROBOT_NAME, VEHTYPE/
    # VEHNUM, ROS_DOMAIN_ID, RMW_IMPLEMENTATION), exactly like the drive/sensors/
    # dlio siblings — nothing in this directory is rover-specific. `required:
    # false` only so that `stop` works on a laptop without the file; `start`
    # refuses to build the session when ROBOT_NAME comes up empty.
    env_file:
      - path: ${ROVER_ENV_FILE:-/etc/rover/rover.env}
        required: false
    environment:
      # Fleet zenoh SESSION config (the file drive/sensors/dlio all load): 5 s
      # non-droppable stall bound + the drop-toward-router qos rule. Resolved
      # from the mount below; --dev points both at docker/dev/.
      ZENOH_SESSION_CONFIG_URI: /home/swarm/config/zenoh_session_config.json5
    volumes:
      - "${ROVER_CONFIG_DIR:-/home/swarm/config}:/home/swarm/config:ro"
    init: true
    stop_grace_period: 15s
    restart: "no"                      # manual stack; a dead pane stays dead
    command: ["sleep", "infinity"]

  # --dev only (compose profile 'dev', never started on a rover): an ISOLATED
  # zenoh router from the same image on 127.0.0.1:7448, configured by
  # dev/zenoh_router_config.json5 — listen only, multicast scouting off, no
  # connect entries — so a laptop stack cannot join the fleet graph (the C2
  # router on alienware-02 listens on *:7447). Sourced explicitly: bash -lc
  # does not read /root/.bashrc for non-interactive shells.
  zenoh-router:
    profiles: [dev]
    image: mighty-hw:local
    container_name: hw-mighty-dev-router
    network_mode: host
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_ROUTER_CONFIG_URI: /home/swarm/config/zenoh_router_config.json5
    volumes:
      - "${ROVER_CONFIG_DIR:-/home/swarm/config}:/home/swarm/config:ro"
    init: true
    restart: "no"
    command: ["bash", "-c", "source /opt/ros/humble/setup.bash && exec ros2 run rmw_zenoh_cpp rmw_zenohd"]
