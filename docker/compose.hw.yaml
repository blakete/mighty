# hw-mighty — ONE idling container; the MIGHTY planner, the state adapter and (on
# ground robots) the MPC are docker-exec'd into it from a HOST tmux session
# 'hw_mighty' built by mighty_hw.sh (the single entrypoint).
#
#   build:   make hw-build            (docker compose build --ssh ...; see Makefile)
#   pull:    ./mighty_hw.sh pull [tag] (fleet registry -> mighty-hw:local)
#   up:      ./mighty_hw.sh start [--dev]   (params: this checkout's config/, see volumes)
#   attach:  tmux attach -t hw_mighty  (HOST session; Ctrl-C / Up / Enter restarts one node)
#   down:    ./mighty_hw.sh stop
#
# The container must NEVER launch the session itself: when its command also
# built the tmux session (pre-2026-07-30) every start produced TWO full stacks
# double-publishing on cmd_vel_auto.
#
# PREREQS on a vehicle: localization (odometry + <ns>/map -> <ns>/odom), a map
# source, and, with rmw_zenoh, a zenoh router on the host (RR fleet: drive.service
# on :7447, dlio.service, the Orin mapper). This file launches none of them; the
# nodes join the host's ROS graph over network_mode: host. See README.hw.md for
# the interface a vehicle has to provide.
name: hw-mighty
services:
  hw-mighty:
    build:
      context: ..                      # the mighty repo root; deps are cloned in-image
      dockerfile: docker/Dockerfile.hw
    image: mighty-hw:local
    container_name: hw-mighty
    network_mode: host                 # join the host's ROS graph (zenoh router on :7447)
    # Identity + transport (ROBOT_NAME, ROS_DOMAIN_ID, RMW_IMPLEMENTATION) from the
    # vehicle's provisioned env, then MIGHTY's own settings (MIGHTY_PLATFORM, ...,
    # written by install_service.sh); the later file wins. Nothing in this
    # directory is vehicle-specific. `required: false` only so that `stop` works
    # without the files; `start` refuses to run without ROBOT_NAME.
    env_file:
      - path: ${ROVER_ENV_FILE:-/etc/rover/rover.env}
        required: false
      - path: ${MIGHTY_ENV_FILE:-/etc/mighty/mighty.env}
        required: false
    environment:
      # Fleet zenoh SESSION config (the file drive/sensors/dlio all load): 5 s
      # non-droppable stall bound + the drop-toward-router qos rule. Resolved
      # from the mount below; --dev points both at docker/dev/.
      ZENOH_SESSION_CONFIG_URI: /home/swarm/config/zenoh_session_config.json5
    volumes:
      - "${ROVER_CONFIG_DIR:-/home/swarm/config}:/home/swarm/config:ro"
      # Planner parameters come from THIS CHECKOUT, not the image: the repo's
      # config/ is mounted over the installed share tree, so a YAML edit + a
      # pane restart (Ctrl-C / Up / Enter) takes effect with no rebuild, and a
      # vehicle's parameter drift is one `git status` here. launch/ stays baked on
      # purpose (a launch edit can reference things the image lacks — that is
      # what start()'s launch-file guard protects). MPC tunables: mpc.yaml lives
      # in the mpc repo; override them from a vehicle overlay's mpc: section.
      # The target is the image's workspace (Dockerfile.hw ARG WS=/ws); compose
      # cannot read image ENV, so the path is repeated here.
      - "../config:/ws/install/mighty/share/mighty/config:ro"
    init: true
    stop_grace_period: 15s
    restart: "no"                      # manual stack; a dead pane stays dead
    command: ["sleep", "infinity"]

  # --dev only (compose profile 'dev', never started on a rover): an ISOLATED
  # zenoh router from the same image on 127.0.0.1:7448, configured by
  # dev/zenoh_router_config.json5 — listen only, multicast scouting off, no
  # connect entries — so a laptop stack cannot join a fleet graph (a laptop may
  # well run its own router on *:7447). Sourced explicitly: bash -lc
  # does not read /root/.bashrc for non-interactive shells.
  zenoh-router:
    profiles: [dev]
    image: mighty-hw:local
    container_name: hw-mighty-dev-router
    network_mode: host
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_ROUTER_CONFIG_URI: /home/swarm/config/zenoh_router_config.json5
    volumes:
      - "${ROVER_CONFIG_DIR:-/home/swarm/config}:/home/swarm/config:ro"
    init: true
    restart: "no"
    command: ["bash", "-c", "source /opt/ros/humble/setup.bash && exec ros2 run rmw_zenoh_cpp rmw_zenohd"]
