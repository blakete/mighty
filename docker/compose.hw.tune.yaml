# OPTIONAL override for on-rover parameter iteration: mounts THIS checkout's
# config/launch/rviz over the installed share tree, so editing a YAML and
# restarting its pane (Ctrl-C / Up / Enter) picks the change up with no image
# rebuild. C++ edits still need `make hw-build`. mpc's config lives in the mpc
# repo (cloned in-image at its mighty.repos pin), so it is not covered here.
#
#   MIGHTY_HW_TUNE=1 ./mighty_hw.sh start
services:
  hw-mighty:
    volumes:
      - "../config:/home/swarm/code/mighty_ws/install/mighty/share/mighty/config:ro"
      - "../launch:/home/swarm/code/mighty_ws/install/mighty/share/mighty/launch:ro"
      - "../rviz:/home/swarm/code/mighty_ws/install/mighty/share/mighty/rviz:ro"
